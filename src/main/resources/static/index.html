<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ 语音日历</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --danger: #ef4444;
            --success: #22c55e;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
        header {
            text-align: center;
            padding: 40px 0 32px;
        }
        header h1 { font-size: 28px; margin-bottom: 6px; }
        header p { color: var(--text-secondary); font-size: 14px; }

        /* 输入区域 */
        .input-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .input-card label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color .2s;
        }
        .input-row input:focus { border-color: var(--primary); }
        .input-row button {
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all .2s;
            white-space: nowrap;
        }
        .input-row button:hover { background: var(--primary-light); }

        /* 语音按钮 */
        .btn-mic {
            width: 44px; height: 44px;
            border-radius: 50% !important;
            padding: 0 !important;
            font-size: 20px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--danger) !important;
            position: relative;
            flex-shrink: 0;
        }
        .btn-mic:hover { background: #dc2626 !important; }
        .btn-mic.listening {
            animation: pulse 1.2s infinite;
            box-shadow: 0 0 0 0 rgba(239,68,68,.5);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
            70% { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        .listening-text {
            font-size: 13px;
            color: var(--danger);
            margin-top: 6px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 筛选 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-bar input[type="date"] {
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .filter-bar button {
            padding: 8px 16px;
            background: var(--text);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        /* 日历 */
        .calendar-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .cal-header h3 { font-size: 18px; }
        .cal-header button {
            padding: 6px 14px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background .2s;
        }
        .cal-header button:hover { background: var(--border); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-name { font-size: 12px; color: var(--text-secondary); padding: 6px 0; font-weight: 600; }
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            position: relative;
            transition: background .15s;
        }
        .cal-day:hover { background: var(--bg); }
        .cal-day.today { background: var(--primary); color: #fff; font-weight: 700; }
        .cal-day.other-month { color: #cbd5e1; }
        .cal-day.selected { background: #eef2ff; outline: 2px solid var(--primary); }
        .cal-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--primary);
            position: absolute;
            bottom: 4px;
        }
        .cal-day.today .cal-dot { background: #fff; }
        .cal-day.has-event { font-weight: 600; }

        /* 选中日期标题 */
        .selected-date-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }

        /* 日程列表 */
        .schedule-list { display: flex; flex-direction: column; gap: 10px; }
        .schedule-card {
            background: var(--card);
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: transform .15s;
        }
        .schedule-card:hover { transform: translateY(-1px); }
        .schedule-info { flex: 1; min-width: 0; }
        .schedule-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-time {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .schedule-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .remind-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            border: none;
        }
        .remind-on { background: #fef3c7; color: #d97706; }
        .remind-off { background: #f1f5f9; color: #94a3b8; }
        .btn-delete {
            padding: 6px 14px;
            background: #fff;
            color: var(--danger);
            border: 1.5px solid #fecaca;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }
        .btn-delete:hover { background: #fef2f2; }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: opacity .3s;
        }
        .toast.show { opacity: 1; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }

        @media (max-width: 480px) {
            .input-row { flex-direction: column; }
            .filter-bar { flex-wrap: wrap; }
            .schedule-card { flex-direction: column; align-items: flex-start; }
            .schedule-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ 语音日历</h1>
            <p>语音输入 → 智能解析 → 日程管理</p>
        </header>

        <!-- 语音输入区 -->
        <div class="input-card">
            <label>🎤 点击麦克风开始语音输入（支持 Chrome/Edge 浏览器）</label>
            <div class="input-row">
                <button class="btn-mic" id="micBtn" onclick="toggleVoice()" title="点击开始语音输入">🎤</button>
                <input type="text" id="voiceInput" placeholder="语音识别结果会显示在这里...">
                <button onclick="createSchedule()">📅 创建日程</button>
            </div>
            <div class="listening-text" id="listeningHint" style="display:none">🔴 正在聆听，请说话...</div>
            <p class="input-hint">💡 支持：今天/明天/后天 + 上午/下午/晚上 + 时间点，或 yyyy-MM-dd HH:mm</p>
        </div>

        <!-- 日历视图 -->
        <div class="calendar-card">
            <div class="cal-header">
                <button onclick="prevMonth()">◀</button>
                <h3 id="calTitle">2025年12月</h3>
                <button onclick="nextMonth()">▶</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <input type="date" id="startDate">
            <span>至</span>
            <input type="date" id="endDate">
            <button onclick="filterSchedules()">🔍 筛选</button>
            <button onclick="loadAllSchedules()" style="background:#64748b">🔄 全部</button>
            <span id="countInfo" style="font-size:13px;color:var(--text-secondary);margin-left:auto"></span>
        </div>

        <!-- 日程列表 -->
        <div class="schedule-list" id="scheduleList">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>暂无日程，输入语音文本开始创建吧！</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API = '/schedule';

        async function api(url, options = {}) {
            const res = await fetch(url, options);
            return res.json();
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function formatTime(str) {
            if (!str) return '';
            const d = new Date(str);
            return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        }

        function renderSchedules(list) {
            const container = document.getElementById('scheduleList');
            document.getElementById('countInfo').textContent = `共 ${list.length} 条`;

            if (!list.length) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>暂无日程</p></div>`;
                return;
            }
            container.innerHTML = list.map(s => `
                <div class="schedule-card">
                    <div class="schedule-info">
                        <div class="schedule-title">${s.eventTitle || '未命名'}</div>
                        <div class="schedule-time">📅 ${formatTime(s.scheduleTime)}</div>
                    </div>
                    <div class="schedule-actions">
                        <button class="remind-badge ${s.isRemind ? 'remind-on' : 'remind-off'}"
                                onclick="toggleRemind(${s.id}, ${s.isRemind})">
                            ${s.isRemind ? '🔔 已提醒' : '🔕 未提醒'}
                        </button>
                        <button class="btn-delete" onclick="deleteSchedule(${s.id})">🗑 删除</button>
                    </div>
                </div>
            `).join('');
        }

        function hasAmbiguousTime(text) {
            // 检查是否只有纯数字时间（如 "3点"）而没有时段词
            const hasPeriod = /凌晨|早上|上午|中午|下午|晚上/.test(text);
            const bareHour = /(?<![\d])([1-7])\s*[点:：]/.test(text);
            return bareHour && !hasPeriod;
        }

        async function createSchedule(forceText) {
            const input = document.getElementById('voiceInput');
            let text = forceText || input.value.trim();
            if (!text) { showToast('请输入语音文本', 'error'); return; }

            // 智能确认：检测到模糊时间
            if (!forceText && hasAmbiguousTime(text)) {
                const match = text.match(/([1-7])\s*[点:：]/);
                const hour = match ? match[1] : '';
                const choice = confirm(
                    `⏰ 您说的是「${hour}点」是：\n\n` +
                    `👉 点击【确定】= 下午${hour}点 (${parseInt(hour)+12}:00)\n` +
                    `👉 点击【取消】= 凌晨${hour}点 (${hour}:00)`
                );
                if (choice) {
                    text = text.replace(/([1-7])\s*[点:：]/, '下午$1点');
                } else {
                    text = text.replace(/([1-7])\s*[点:：]/, '凌晨$1点');
                }
            }

            const data = await api(`${API}/voiceAdd?voiceText=${encodeURIComponent(text)}`, { method: 'POST' });
            if (data.code === 200) {
                showToast('✅ 日程创建成功！');
                input.value = '';
                loadAllSchedules();
            } else {
                showToast(data.msg || '创建失败', 'error');
            }
        }

        async function loadAllSchedules() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
            const data = await api(`${API}/list`);
            if (data.code === 200) {
                buildScheduleMap(data.data);
                renderCalendar();
                renderSchedules(data.data);
            }
        }

        async function filterSchedules() {
            const s = document.getElementById('startDate').value;
            const e = document.getElementById('endDate').value;
            if (!s || !e) { showToast('请选择日期范围', 'error'); return; }
            const data = await api(`${API}/listByRange?start=${s}&end=${e}`);
            if (data.code === 200) {
                buildScheduleMap(data.data);
                renderCalendar();
                renderSchedules(data.data);
            }
        }

        async function deleteSchedule(id) {
            if (!confirm('确定删除这条日程吗？')) return;
            const data = await api(`${API}/delete/${id}`, { method: 'DELETE' });
            if (data.code === 200) {
                showToast('已删除');
                loadAllSchedules();
            } else {
                showToast(data.msg, 'error');
            }
        }

        async function toggleRemind(id, current) {
            const next = current ? 0 : 1;
            const data = await api(`${API}/remind/${id}?isRemind=${next}`, { method: 'PUT' });
            if (data.code === 200) {
                showToast(next ? '🔔 已开启提醒' : '🔕 已关闭提醒');
                loadAllSchedules();
            } else {
                showToast(data.msg, 'error');
            }
        }

        // ========== 日历视图 ==========
        let calYear, calMonth;
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth() + 1;
        let scheduleDates = {}; // { '2025-12-25': [schedules...] }

        function prevMonth() {
            calMonth--; if (calMonth < 1) { calMonth = 12; calYear--; }
            renderCalendar();
        }
        function nextMonth() {
            calMonth++; if (calMonth > 12) { calMonth = 1; calYear++; }
            renderCalendar();
        }

        function buildScheduleMap(list) {
            scheduleDates = {};
            list.forEach(s => {
                const d = s.scheduleTime ? s.scheduleTime.split(' ')[0] : null;
                if (d) {
                    if (!scheduleDates[d]) scheduleDates[d] = [];
                    scheduleDates[d].push(s);
                }
            });
        }

        function renderCalendar() {
            document.getElementById('calTitle').textContent = `${calYear}年${calMonth}月`;
            const grid = document.getElementById('calGrid');
            const days = ['日','一','二','三','四','五','六'];
            let html = days.map(d => `<div class="cal-day-name">${d}</div>`).join('');

            const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth, 0).getDate();
            const daysInPrev = new Date(calYear, calMonth - 1, 0).getDate();

            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

            for (let i = firstDay - 1; i >= 0; i--) {
                const d = daysInPrev - i;
                const ds = `${calMonth === 1 ? calYear-1 : calYear}-${String(calMonth === 1 ? 12 : calMonth-1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                html += `<div class="cal-day other-month" onclick="pickDate('${ds}')">${d}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = ds === todayStr;
                const hasEvt = scheduleDates[ds] && scheduleDates[ds].length > 0;
                html += `<div class="cal-day${isToday ? ' today' : ''}${hasEvt ? ' has-event' : ''}" onclick="pickDate('${ds}')" id="cal-${ds}">${d}${hasEvt ? '<span class="cal-dot"></span>' : ''}</div>`;
            }
            const remaining = 42 - (firstDay + daysInMonth);
            for (let d = 1; d <= remaining; d++) {
                const ds = `${calMonth === 12 ? calYear+1 : calYear}-${String(calMonth === 12 ? 1 : calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                html += `<div class="cal-day other-month" onclick="pickDate('${ds}')">${d}</div>`;
            }
            grid.innerHTML = html;
        }

        async function pickDate(ds) {
            document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
            document.getElementById(`cal-${ds}`)?.classList.add('selected');
            document.getElementById('startDate').value = ds;
            document.getElementById('endDate').value = ds;
            const data = await api(`${API}/listByRange?start=${ds}&end=${ds}`);
            if (data.code === 200) renderSchedules(data.data);
        }

        // ========== 语音识别 ==========
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        function initRecognition() {
            if (!SpeechRecognition) {
                showToast('⚠️ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge', 'error');
                return null;
            }
            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.interimResults = true;
            rec.continuous = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('micBtn').textContent = '🔴';
                document.getElementById('listeningHint').style.display = 'block';
                document.getElementById('voiceInput').value = '';
                document.getElementById('voiceInput').placeholder = '正在聆听...';
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }
                const displayText = finalText || interimText;
                document.getElementById('voiceInput').value = displayText;
                document.getElementById('voiceInput').placeholder = displayText || '正在聆听...';
                // 识别到最终结果后自动创建日程
                if (finalText.trim()) {
                    stopListening();
                    createSchedule();
                }
            };

            rec.onerror = (event) => {
                stopListening();
                if (event.error === 'not-allowed') {
                    showToast('⚠️ 请允许麦克风权限后重试', 'error');
                } else if (event.error !== 'aborted') {
                    showToast('⚠️ 语音识别失败：' + event.error, 'error');
                }
            };

            rec.onend = () => {
                stopListening();
            };

            return rec;
        }

        function toggleVoice() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) recognition = initRecognition();
            if (!recognition) return;
            try {
                recognition.start();
            } catch (e) {
                stopListening();
            }
        }

        function stopListening() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('micBtn').textContent = '🎤';
            document.getElementById('listeningHint').style.display = 'none';
            if (document.getElementById('voiceInput').placeholder === '正在聆听...') {
                document.getElementById('voiceInput').placeholder = '例如：明天下午3点项目周会';
            }
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
        }

        // 回车快捷创建
        document.getElementById('voiceInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') createSchedule();
        });

        // ========== 定时提醒 ==========
        let remindedIds = new Set();

        function checkReminders() {
            const now = new Date();
            const nowStr = now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0') + ' ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0');
            api(`${API}/list`).then(data => {
                if (data.code !== 200) return;
                data.data.forEach(s => {
                    if (!s.isRemind) return;
                    const schTime = (s.scheduleTime || '').slice(0, 16); // "yyyy-MM-dd HH:mm"
                    if (schTime === nowStr && !remindedIds.has(s.id)) {
                        remindedIds.add(s.id);
                        // 浏览器桌面通知
                        if (Notification.permission === 'granted') {
                            new Notification('🔔 日程提醒', {
                                body: `📅 ${s.eventTitle}\n⏰ ${formatTime(s.scheduleTime)}`,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">🔔</text></svg>',
                                tag: 'schedule-reminder',
                                requireInteraction: true
                            });
                        }
                        // 页面内弹窗
                        showToast(`⏰ 提醒：${s.eventTitle}`, 'error');
                    }
                });
            });
        }

        // 请求通知权限
        if ('Notification' in window && Notification.permission === 'default') {
            document.getElementById('micBtn').addEventListener('click', () => {
                Notification.requestPermission();
            }, { once: true });
        }

        // 每20秒检查一次
        setInterval(checkReminders, 20000);
        checkReminders();

        // 初始加载
        renderCalendar();
        loadAllSchedules();
    </script>
</body>
